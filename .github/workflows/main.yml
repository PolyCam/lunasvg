---
name: Build
on:
  - push
  - pull_request
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build with cmake
        run: |
          cmake -B build .
          cmake --build build/ -t package
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build with cmake
        run: |
          cmake -B build .
          cmake --build build/ -t package
